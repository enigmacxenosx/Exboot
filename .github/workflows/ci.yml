name: CI — Python Lint & Freshness Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lint
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          flake8 exboot.py --max-line-length=120 --count || true

      - name: Freshness tests
        run: python tests_freshness.py
