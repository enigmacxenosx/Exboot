name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build Exboot executable
        shell: pwsh
        run: .\build_windows.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Exboot installer
        shell: pwsh
        run: .\build_installer.ps1

      - name: Install and smoke-test the built installer
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer-output\*.exe | Select-Object -First 1
          if (-not $installer) {
            throw "No installer executable was produced."
          }
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer exited with code $($install.ExitCode)."
          }
          $installed = Join-Path ${env:ProgramFiles} "Exboot\Exboot.exe"
          if (-not (Test-Path $installed)) {
            throw "Installed Exboot executable was not found at $installed."
          }
          $smoke = Start-Process -FilePath $installed -ArgumentList "--smoke-test" -PassThru
          if (-not $smoke.WaitForExit(30000)) {
            $smoke.Kill()
            throw "Installed Exboot startup smoke test timed out."
          }
          if ($smoke.ExitCode -ne 0) {
            throw "Installed Exboot startup smoke test exited with code $($smoke.ExitCode)."
          }
          Write-Output "Installed Exboot startup smoke test passed."

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Exboot-Windows-Installer
          path: installer-output/*.exe

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "${{ github.ref_name }}" installer-output/*.exe --clobber --repo "${{ github.repository }}"
