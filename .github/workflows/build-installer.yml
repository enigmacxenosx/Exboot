name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build Exboot executable
        shell: pwsh
        run: .\build_windows.ps1

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Exboot installer
        shell: pwsh
        run: .\build_installer.ps1

      - name: Create installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer-output\ExbootSetup-*.exe | Select-Object -First 1
          if (-not $installer) { throw 'ExbootSetup installer was not found.' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content "$($installer.FullName).sha256" -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Exboot-Windows-Installer
          path: installer-output/*

      - name: Attach installer to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release upload "${{ github.ref_name }}" installer-output/*.exe installer-output/*.exe.sha256 --clobber --repo "${{ github.repository }}"
